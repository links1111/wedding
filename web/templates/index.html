<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>婚礼请柬</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #1a1410;
            font-family: 'Inter', sans-serif;
            overscroll-behavior-y: contain;
            scroll-snap-type: y mandatory;
        }
        /* 全屏翻页场景：上下滑只切换卡片，吸附一屏 */
        .scene {
            position: relative;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }
        /* 顶部常驻“长按看清文字”提示 */
        .gesture-top {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 55;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            border-radius: 50px;
            background: rgba(15,12,10,0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,245,235,0.16);
            color: rgba(255,245,235,0.85);
            font-size: 12px;
            letter-spacing: 2px;
            pointer-events: none;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            max-width: 88vw;
        }
        .carousel-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 0;
            overflow: hidden;
            background: #1a1410;
        }
        .carousel-bg .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.8s ease-in-out;
            will-change: opacity;
        }
        .carousel-bg .slide.active { opacity: 1; }
        .invitation-card {
            /* 可通过管理后台动态调整：卡片底色、透明度、毛玻璃模糊/饱和度 */
            --card-rgb: 247, 242, 235;
            --card-alpha: 0.15;
            --glass-blur: 16px;
            --glass-saturate: 1.8;
            /* 文字与装饰色（随轮播背景亮度自适应切换） */
            --text-strong: #ffffff;
            --text-body: #faf5ee;
            --text-muted: rgba(255,248,240,0.9);
            --text-dim: rgba(255,248,240,0.65);
            --line: rgba(255,245,235,0.18);
            --line-soft: rgba(255,245,235,0.12);
            --line-bright: rgba(255,245,235,0.55);
            --line-strong: rgba(255,245,235,0.3);
            --card-inset: rgba(255,245,235,0.15);
            --glow: rgba(0,0,0,0.35);
            --btn-bg: rgba(255,245,235,0.16);
            --btn-border: rgba(255,245,235,0.4);
            --btn-bg-hover: rgba(255,245,235,0.3);
            --btn-border-hover: rgba(255,245,235,0.65);
            position: relative;
            z-index: 10;
            max-width: 460px;
            width: 100%;
            background: rgba(var(--card-rgb), var(--card-alpha));
            backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            border-radius: 48px;
            padding: 26px 26px 22px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px var(--card-inset) inset;
            border: 1px solid var(--line-strong);
            color: var(--text-body);
            text-shadow: 0 2px 12px var(--glow);
        }
        .invitation-card * { text-shadow: 0 2px 12px var(--glow); }
        /* 卡片内容超高时卡片内部滚动，保证整页固定、一次翻一卡 */
        .invitation-card, .sub-card {
            max-height: calc(100dvh - 40px);
            overflow-y: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .invitation-card::-webkit-scrollbar,
        .sub-card::-webkit-scrollbar { display: none; }
        /* 亮背景 → 深色文字，始终保持最佳对比度 */
        .invitation-card.light-bg {
            --text-strong: #1f1a15;
            --text-body: #2a241e;
            --text-muted: rgba(30,25,20,0.85);
            --text-dim: rgba(30,25,20,0.65);
            --line: rgba(42,36,30,0.22);
            --line-soft: rgba(42,36,30,0.14);
            --line-bright: rgba(42,36,30,0.42);
            --line-strong: rgba(42,36,30,0.3);
            --card-inset: rgba(42,36,30,0.08);
            --glow: rgba(255,255,255,0.35);
            --btn-bg: rgba(42,36,30,0.1);
            --btn-border: rgba(42,36,30,0.42);
            --btn-bg-hover: rgba(42,36,30,0.16);
            --btn-border-hover: rgba(42,36,30,0.55);
        }
        /* 子卡片内容：与主请柬同款磨砂玻璃面（尺寸/圆角/内边距一致，
           透明度/模糊强度/饱和度沿用后台「卡片样式」设置） */
        .sub-card {
            --card-rgb: 247, 242, 235;
            --card-alpha: 0.15;
            --glass-blur: 16px;
            --glass-saturate: 1.8;
            /* 文字与装饰色默认（深底），随背景亮度切换 .light-bg */
            --text-strong: #ffffff; --text-body: #faf5ee;
            --text-muted: rgba(255,248,240,0.9); --text-dim: rgba(255,248,240,0.65);
            --line: rgba(255,245,235,0.18);
            --line-soft: rgba(255,245,235,0.12);
            --line-strong: rgba(255,245,235,0.3);
            --card-inset: rgba(255,245,235,0.15);
            --glow: rgba(0,0,0,0.4);
            position: relative;
            z-index: 10;
            max-width: 460px;
            width: 100%;
            background: rgba(var(--card-rgb), var(--card-alpha));
            backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            border-radius: 48px;
            padding: 26px 26px 22px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px var(--card-inset) inset;
            border: 1px solid var(--line-strong);
            color: var(--text-body);
            text-shadow: 0 2px 12px var(--glow);
            text-align: center;
        }
        .sub-card.light-bg {
            --text-strong: #1f1a15; --text-body: #2a241e;
            --text-muted: rgba(30,25,20,0.85); --text-dim: rgba(30,25,20,0.65);
            --line: rgba(42,36,30,0.22);
            --line-soft: rgba(42,36,30,0.14);
            --line-strong: rgba(42,36,30,0.3);
            --card-inset: rgba(42,36,30,0.08);
            --glow: rgba(255,255,255,0.4);
            border-color: rgba(42,36,30,0.3);
        }
        /* 类型专属版式：徽记 + 类型标 + 差异化点缀 */
        .sub-card .emblem {
            display: inline-flex; align-items: center; justify-content: center;
            width: 52px; height: 52px; border-radius: 50%;
            border: 1px solid var(--accent);
            font-size: 24px; color: var(--accent); line-height: 1;
            margin-bottom: 14px;
            box-shadow: 0 0 18px rgba(0,0,0,0.15);
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .sub-card .type-label {
            font-size: 11px; letter-spacing: 5px; text-transform: uppercase;
            color: var(--accent); margin-bottom: 16px; font-weight: 400;
        }
        .sub-card.t-meet      { --accent: #d7b26e; }
        .sub-card.t-heartbeat { --accent: #e39aa0; }
        .sub-card.t-date      { --accent: #a9c0d8; }
        .sub-card.t-confess   { --accent: #dfa6d2; }
        .sub-card.t-together  { --accent: #c9a9d0; }
        .sub-card.t-travel    { --accent: #7fb6a8; }
        .sub-card.t-propose   { --accent: #e2b07a; }
        .sub-card.t-engage    { --accent: #b99a72; }
        .sub-card.light-bg .emblem { border-color: rgba(42,36,30,0.35); }
        .sub-card.light-bg .type-label { color: rgba(42,36,30,0.8); }
        /* 末尾回执场景：精致磨砂收尾卡（内嵌完整回执表单） */
.rsvp-end {
    --re-gold: #e2c186;
    --re-dim: rgba(246,239,227,0.68);
    max-width: 440px; width: 100%;
    text-align: center;
    background:
        radial-gradient(120% 130% at 50% -10%, rgba(150,112,70,0.20), transparent 55%),
        linear-gradient(168deg, rgba(48,37,28,0.88), rgba(22,16,12,0.92));
    backdrop-filter: blur(24px) saturate(1.35);
    -webkit-backdrop-filter: blur(24px) saturate(1.35);
    border: 1px solid rgba(255,236,210,0.2);
    border-radius: 36px;
    padding: 42px 30px 36px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,240,220,0.04);
    color: #f6efe3;
    max-height: 94dvh;
    overflow-y: auto;
    scrollbar-width: none;
}
.rsvp-end::-webkit-scrollbar { display: none; }
.rsvp-end .re-emblem {
    display: inline-flex; align-items: center; justify-content: center;
    width: 58px; height: 58px; border-radius: 50%;
    border: 1px solid var(--re-gold);
    color: var(--re-gold); font-size: 26px;
    margin-bottom: 16px; position: relative;
    box-shadow: 0 0 24px rgba(226,193,134,0.2);
}
.rsvp-end .re-emblem::after {
    content: ''; position: absolute; inset: -6px; border-radius: 50%;
    border: 1px solid rgba(226,193,134,0.26);
}
.rsvp-end .re-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 27px; font-weight: 500; letter-spacing: 10px;
    color: #fff7ea; margin-bottom: 12px; padding-left: 6px;
}
.rsvp-end .ornament {
    font-size: 11px; letter-spacing: 10px; color: rgba(226,193,134,0.62);
    margin-bottom: 14px; padding-left: 4px;
}
.rsvp-end .re-sub {
    font-size: 13px; letter-spacing: 3px; color: var(--re-dim);
    line-height: 1.9; margin-bottom: 20px;
}
.rsvp-end .re-divider {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 20px; color: rgba(226,193,134,0.72);
    font-size: 10px; letter-spacing: 6px; white-space: nowrap;
}
.rsvp-end .re-divider::before,
.rsvp-end .re-divider::after { content: ''; height: 1px; flex: 1; background: rgba(255,236,210,0.16); }
        .ornament-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 14px;
            opacity: 0.7;
        }
        .ornament-line span {
            display: block;
            height: 1px;
            background: var(--line-bright);
            width: 36px;
        }
        .ornament-line i {
            font-size: 8px;
            color: var(--text-muted);
            letter-spacing: 4px;
            animation: softGlow 4s infinite ease-in-out;
        }
        .chinese-title {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-size: 13px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 2px;
        }
        .names {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 44px;
            line-height: 1.1;
            text-align: center;
            color: var(--text-strong);
            letter-spacing: 2px;
            margin: 4px 0 4px;
            text-shadow: 0 4px 20px var(--glow);
        }
        .names .ampersand {
            font-weight: 300;
            font-style: italic;
            color: var(--text-muted);
            padding: 0 6px;
            font-size: 38px;
        }
        .date-block {
            text-align: center;
            margin: 12px 0 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
        }
        .date-main {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-size: 26px;
            letter-spacing: 3px;
            color: var(--text-strong);
        }
        .date-sub {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 4px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
        }
        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0 14px;
        }
        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 0 4px;
        }
        .info-icon {
            font-size: 14px;
            color: var(--text-muted);
            width: 24px;
            text-align: center;
            margin-top: 1px;
            opacity: 0.9;
        }
        .info-text {
            font-size: 15px;
            font-weight: 400;
            color: var(--text-body);
            letter-spacing: 0.3px;
            line-height: 1.5;
        }
        .info-text strong { font-weight: 500; color: var(--text-strong); }
        .info-text .it-time {
            display: inline-block;
            margin-left: 8px;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }
        .info-text .it-time:empty { display: none; }
        .info-text .light {
            color: var(--text-muted);
            font-size: 14px;
            display: block;
            margin-top: 2px;
        }
        .rsvp-section {
            margin: 12px 0 10px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
            text-align: center;
        }
        .rsvp-section .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-size: 17px;
            letter-spacing: 4px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .rsvp-btn {
            display: inline-block;
            padding: 14px 56px;
            background: linear-gradient(135deg, #d9b877, #c9a96e);
            border: none;
            border-radius: 50px;
            color: #1a1410;
            text-decoration: none;
            letter-spacing: 4px;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.22);
            transition: all 0.3s ease;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .rsvp-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 10px 28px rgba(0,0,0,0.28);
        }
        .rsvp-hint {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }
        .nav-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 7px 18px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 50px;
            color: var(--text-body);
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        .nav-btn:hover { background: var(--btn-bg-hover); border-color: var(--btn-border-hover); }
        /* 背景音乐悬浮按钮 */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
            width: 44px;
            height: 44px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 22px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.55);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .music-btn:active { transform: scale(0.92); }
        .music-btn.playing { animation: musicPulse 2s ease-in-out infinite; }
        /* 开场手势提示 */
        .gesture-hint {
            position: fixed;
            bottom: 34px;
            left: 50%;
            transform: translate(-50%, 8px);
            z-index: 60;
            background: rgba(15,12,10,0.74);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,245,235,0.25);
            color: #f5ede4;
            border-radius: 14px;
            padding: 10px 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
            text-align: center;
            line-height: 1.5;
            opacity: 0;
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
            max-width: 84vw;
        }
        .gesture-hint .gh-main { font-size: 13px; letter-spacing: 2px; color: #fff; }
        .gesture-hint .gh-sub { font-size: 12px; letter-spacing: 1px; color: rgba(255,245,235,0.72); }
        .gesture-hint.show { opacity: 1; transform: translate(-50%, 0); }
        .gesture-hint.hide { opacity: 0; transform: translate(-50%, 8px); }
        @keyframes musicPulse {
            0%, 100% { text-shadow: 0 2px 10px rgba(0,0,0,0.55); }
            50% { text-shadow: 0 2px 16px rgba(0,0,0,0.55), 0 0 14px rgba(255,255,255,0.4); }
        }
        .footer-note {
            display: flex;
            justify-content: center;
            gap: 18px;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 2px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--line-soft);
        }
        .footer-note span { opacity: 0.8; }
        .dot-divider {
            display: inline-block;
            width: 3px;
            height: 3px;
            background: var(--text-dim);
            border-radius: 50%;
            margin: 0 8px;
            opacity: 0.5;
        }
        .handwrite {
            text-align: center;
            margin-top: 8px;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 2px;
        }
        .countdown-block {
            text-align: center;
            margin: 12px 0 4px;
        }
        .countdown-label {
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .countdown-number {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 38px;
            color: var(--text-strong);
            line-height: 1;
            text-shadow: 0 4px 20px var(--glow);
        }
        .countdown-unit {
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-left: 4px;
        }
        .rsvp-end .rsvp-form {
            display: flex; flex-direction: column; gap: 13px;
            text-align: left; margin-bottom: 6px;
        }
        .rsvp-end .re-field label {
            display: block; font-size: 11px; letter-spacing: 2px;
            color: rgba(226,193,134,0.72); margin-bottom: 6px;
        }
        .rsvp-end .re-field input,
        .rsvp-end .re-field textarea {
            width: 100%; padding: 11px 15px; box-sizing: border-box;
            background: rgba(255,245,235,0.06);
            border: 1px solid rgba(255,240,220,0.18);
            border-radius: 13px; color: #f6efe3; font-size: 15px;
            font-family: 'Inter', sans-serif; outline: none;
            transition: border-color .3s;
            -webkit-appearance: none; appearance: none;
        }
        .rsvp-end .re-field input::-webkit-outer-spin-button,
        .rsvp-end .re-field input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .rsvp-end .re-field input[type=number] { -moz-appearance: textfield; }
        .rsvp-end .re-field textarea { resize: none; min-height: 54px; }
        .rsvp-end .re-field input::placeholder,
        .rsvp-end .re-field textarea::placeholder { color: rgba(246,239,227,0.3); }
        .rsvp-end .re-field input:focus,
        .rsvp-end .re-field textarea:focus { border-color: rgba(226,193,134,0.6); }
        .rsvp-end .rsvp-form [hidden] { display: none !important; }
        .rsvp-end .re-seg {
            display: flex; background: rgba(255,245,235,0.06);
            border: 1px solid rgba(255,240,220,0.16);
            border-radius: 13px; padding: 3px; gap: 3px;
        }
        .rsvp-end .re-seg button {
            flex: 1; padding: 9px 0; border: none; border-radius: 10px;
            background: transparent; color: rgba(246,239,227,0.55);
            font-size: 13px; letter-spacing: 2px; cursor: pointer;
            font-family: 'Inter', sans-serif; transition: all .25s;
        }
        .rsvp-end .re-seg button.on {
            background: linear-gradient(135deg, #e2c186, #c8a66c);
            color: #1a1410; font-weight: 600;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        }
        .rsvp-end .rsvp-submit {
            margin-top: 8px; padding: 13px; border: none;
            border-radius: 50px; cursor: pointer;
            background: linear-gradient(135deg, #e2c186, #c9a66c);
            color: #1a1410; font-size: 15px; letter-spacing: 5px;
            font-weight: 600; font-family: 'Inter', sans-serif;
            box-shadow: 0 10px 26px rgba(0,0,0,0.28);
            transition: all .3s ease;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .invitation-card { padding: 16px 18px 16px; border-radius: 32px; backdrop-filter: blur(min(4px, var(--glass-blur))) saturate(var(--glass-saturate)); -webkit-backdrop-filter: blur(min(4px, var(--glass-blur))) saturate(var(--glass-saturate)); }
            .ornament-line { margin-bottom: 10px; }
            .names { font-size: 30px; margin: 2px 0 2px; }
            .date-block { margin: 10px 0 10px; padding-bottom: 10px; }
            .date-main { font-size: 20px; }
            .info-grid { gap: 8px; margin: 10px 0 12px; }

            .countdown-number { font-size: 28px; }

            .rsvp-end { padding: 30px 18px 24px; }
            .rsvp-end .re-title { font-size: 23px; letter-spacing: 6px; }
        }
        @media (max-width: 380px) {
            .invitation-card { padding: 14px 14px 14px; }
            .names { font-size: 28px; }

<body>

    <!-- ===== 背景轮播（图片列表由 /api/invitation 动态生成） ===== -->
    <div class="carousel-bg" id="bgCarousel"></div>

    <!-- ===== 场景 1：主请柬（首屏） ===== -->
    <section class="scene" id="sceneMain">
    <div class="invitation-card">

        <div class="ornament-line">

            </div>
            <div class="info-item">
                <span class="info-icon">✧</span>
                <div class="info-text">
                    <strong class="it-title">晚宴</strong>
                    <span class="it-time"></span>
                    <span class="light it-sub">水岸餐厅</span>
                </div>
            </div>
            <div class="info-item">
                <span class="info-icon">✧</span>
                <div class="info-text">
                    <strong class="it-title">着装</strong>

        <div class="rsvp-section">
            <div class="section-title">R · S · V · P</div>

            <div class="rsvp-hint">期待您的回复</div>
        </div>
    </div>
    </section><!-- /sceneMain -->

    <!-- ===== 故事子卡与末尾回执场景（JS 动态构建） ===== -->
    <div id="storyScenes"></div>

    <!-- ===== 背景音乐 ===== -->
    <audio id="bgm" loop preload="auto"></audio>
    <button class="music-btn" id="musicBtn" aria-label="背景音乐">♪</button>

    <!-- 顶部常驻提示：长按看清文字 -->
    <div class="gesture-top" id="gestureHint">长按，让文字更清晰</div>

    <!-- ===== 轮播 & API 对接 ===== -->
    <script>
        (function() {
            // 从路径 /w/{token} 取 token
            var WEDDING_TOKEN = (location.pathname.split('/')[2] || '');
            var API = '/api/w/' + WEDDING_TOKEN;
            // ===== 加载请柬信息（文案 / 样式 / 背景图列表） =====
            fetch(API + '/invitation')
                .then(r => r.json())
                .then(res => {
                    if (!res.ok || !res.data) return;
                    const d = res.data;
                    // 新人姓名
                    if (d.groom) document.getElementById('groomName').textContent = d.groom;
                    if (d.bride) document.getElementById('brideName').textContent = d.bride;
                    // 网站标题用新人姓名（微信分享/标签页更友好）
                    var titleNames = [d.groom, d.bride].filter(function(n){ return n; }).join(' & ');
                    if (titleNames) document.title = titleNames + ' · 婚礼请柬';
                    // 日期与地点
                    if (d.date_main) document.getElementById('dateMain').textContent = d.date_main;
                    if (d.date_sub) document.getElementById('dateSub').textContent = d.date_sub;
                    if (d.venue) {
                        document.getElementById('venueLine').textContent = d.venue;
                    } else {
                        document.getElementById('venueLine').style.display = 'none';
                    }
                    // 标题
                    if (d.chinese_title) {
                        document.getElementById('chineseTitle').textContent = '— ' + d.chinese_title + ' —';
                    }
                    // 信息条目（仪式 / 晚宴 / 着装）
                    const titles = document.querySelectorAll('.it-title');
                    const subs = document.querySelectorAll('.it-sub');
                    const times = document.querySelectorAll('.it-time');
                    (d.info_items || []).forEach(function(item, i) {
                        if (titles[i]) titles[i].textContent = item.title || '';
                        if (subs[i]) subs[i].textContent = item.sub || '';
                        if (times[i]) times[i].textContent = item.time || '';
                    });
                    // footer 文案
                    const fts = document.querySelectorAll('.footer-note .ft');
                    (d.footer || []).forEach(function(txt, i) {
                        if (fts[i]) fts[i].textContent = txt;
                    });
                    if (d.handwrite) document.getElementById('handwrite').textContent = d.handwrite;
                    // 倒计时
                    if (typeof d.countdown === 'number' && d.countdown >= 0) {
                        document.getElementById('countdownBlock').style.display = 'block';
                        document.getElementById('countdownNumber').textContent = d.countdown;
                    }
                    // 卡片样式（透明度 / 毛玻璃），记录配置供长按模糊恢复
                    lastStyle = d.style;
                    applyStyle(d.style);
                    // 背景轮播
                    buildCarousel(d.slides || []);
                    // 位置导航与背景音乐
                    setupNav(d.map_link, d.venue);
                    setupMusic(d.music_url);
                    // 故事子卡与末尾回执场景
                    buildStoryScenes(d.cards || []);
                })
                .catch(err => console.error('加载请柬信息失败:', err));

            // ===== 卡片透明度 / 毛玻璃样式 =====
            let glassConfig = null;      // 最近一次「卡片样式」参数；供故事子卡沿用同一套磨砂
            function applyGlassTo(el) {
                if (!el || !glassConfig) return;
                const g = glassConfig;
                el.style.setProperty('--card-rgb', g.rgb);
                el.style.setProperty('--card-alpha', g.alpha);
                el.style.setProperty('--glass-blur', g.blur);
                el.style.setProperty('--glass-saturate', g.sat);
                if (!g.enabled) {
                    el.style.backdropFilter = 'none';
                    el.style.webkitBackdropFilter = 'none';
                }
            }
            function applyStyle(style) {
                if (!style) return;
                const card = document.querySelector('.invitation-card');
                if (!card) return;
                const alpha = clamp(parseInt(style.card_transparency, 10) || 0, 0, 100) / 100;
                const color = style.card_color || '#f7f2eb';
                const glass = style.glass_enabled !== 'false';
                const blur = clamp(parseInt(style.glass_blur, 10) || 0, 0, 50);
                const sat = clamp(parseInt(style.glass_saturate, 10) || 100, 100, 300);
                glassConfig = {
                    rgb: hexToRgb(color),
                    alpha: alpha.toFixed(2),
                    blur: (glass ? blur : 0) + 'px',
                    sat: (glass ? sat / 100 : 1).toFixed(2),
                    enabled: glass
                };
                applyGlassTo(card);
            }
            // ===== 背景轮播（动态生成 + 按背景亮度自适应文字颜色） =====
            const slideBrightness = [];

            // 计算单张图片的平均亮度（Rec.709 加权），用于判断该用深色还是浅色文字
            function computeBrightness(url, done) {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = function() {
                    try {
                        const c = document.createElement('canvas');
                        c.width = 32; c.height = 32;
                        const ctx = c.getContext('2d');
                        ctx.drawImage(img, 0, 0, 32, 32);
                        const d = ctx.getImageData(0, 0, 32, 32).data;
                        let sum = 0;
                        for (let i = 0; i < d.length; i += 4) {
                            sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
                        }
                        done(sum / (d.length / 4));
                    } catch(e) { done(null); }
                };
                img.onerror = function() { done(null); };
                img.src = url;
            }

            // 亮背景(brightness>150) → 深色文字；否则浅色文字
            // 文字颜色随时间平滑渐变（时长与背景交叉淡化一致），而非瞬间切换
            const PALETTES = {
                dark:  { strong: [255,255,255,1], body: [250,245,238,1], muted: [255,248,240,0.9], dim: [255,248,240,0.65], glow: [0,0,0,0.35] },
                light: { strong: [31,26,21,1], body: [42,36,30,1], muted: [30,25,20,0.85], dim: [30,25,20,0.65], glow: [255,255,255,0.35] }
            };
            let colorFactor = null; // null = 未初始化（首图直接落位）
            let colorAnim = null;

            function lerpColor(a, b, f) {
                return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
            }
            function setColorVar(card, name, c) {
                const col = c[3] >= 1
                    ? 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')'
                    : 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + c[3].toFixed(2) + ')';
                card.style.setProperty(name, col);
            }
            function applyPalette(card, f) {
                const p0 = PALETTES.dark, p1 = PALETTES.light;
                setColorVar(card, '--text-strong', lerpColor(p0.strong, p1.strong, f));
                setColorVar(card, '--text-body', lerpColor(p0.body, p1.body, f));
                setColorVar(card, '--text-muted', lerpColor(p0.muted, p1.muted, f));
                setColorVar(card, '--text-dim', lerpColor(p0.dim, p1.dim, f));
                setColorVar(card, '--glow', lerpColor(p0.glow, p1.glow, f));
            }
            function applyBrightness(index) {
                const card = document.querySelector('.invitation-card');
                const b = slideBrightness[index];
                if (!card || b == null) return;
                const target = b > 150 ? 1 : 0;
                // 结构性颜色（边框/按钮等）仍由 .light-bg 类即时切换
                card.classList.toggle('light-bg', target === 1);
                if (colorFactor === null) {
                    colorFactor = target;
                    applyPalette(card, target);
                    return;
                }
                if (target === colorFactor) return;
                if (colorAnim) cancelAnimationFrame(colorAnim);
                const start = colorFactor;
                const t0 = performance.now();
                const dur = 1800;
                const ease = function(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; };
                function frame(now) {
                    const t = Math.min((now - t0) / dur, 1);
                    colorFactor = start + (target - start) * ease(t);
                    applyPalette(card, colorFactor);
                    if (t < 1) colorAnim = requestAnimationFrame(frame);
                    else colorFactor = target;
                }
                colorAnim = requestAnimationFrame(frame);
            }

            // ===== 全局背景轮播：图片列表随所在页面切换；自动轮播 + 手动左右划 =====
            let mainSlideList = [];
            let carList = [];
            let carIdx = 0;
            let carTimer = null;
            const carouselEl = document.getElementById('bgCarousel');

            function stopCar() { if (carTimer) { clearInterval(carTimer); carTimer = null; } }
            function startCar() {
                stopCar();
                if (carList.length > 1) carTimer = setInterval(function() { carNext(1); }, 5000);
            }
            // 渲染当前列表：淡入首图，列表切换平滑
            function renderCarousel(list) {
                stopCar();
                carList = (list || []).slice();
                carIdx = 0;
                carouselEl.innerHTML = '';
                if (!carList.length) {
                    const d = document.createElement('div');
                    d.className = 'slide active';
                    d.style.background = '#1a1410';
                    carouselEl.appendChild(d);
                }
                carList.forEach(function(url, i) {
                    const d = document.createElement('div');
                    d.className = 'slide' + (i === 0 ? ' active' : '');
                    d.style.backgroundImage = "url('" + url + "')";
                    carouselEl.appendChild(d);
                });
                startCar();
            }
            function carShow(i) {
                const slides = carouselEl.querySelectorAll('.slide');
                if (!slides.length) return;
                carIdx = (i + slides.length) % slides.length;
                for (let k = 0; k < slides.length; k++) slides[k].classList.toggle('active', k === carIdx);
                if (carList.length) {
                    computeBrightness(carList[carIdx], function(b) {
                        if (b != null) {
                            const mc = document.querySelector('.invitation-card');
                            if (mc) mc.classList.toggle('light-bg', b > 150);
                        }
                    });
                }
            }
            function carNext(dir) { if (carList.length) carShow((carIdx + dir + carList.length) % carList.length); }
            function carManual(dir) { if (carList.length > 1) { carNext(dir); startCar(); } } // 手动后自动轮播重新计时

            // 手动左右划切换当前列表图片（横划；纵向仍交还翻页）
            (function bindHorizontalSwipe() {
                let sx = 0, sy = 0, tracking = false;
                carouselEl.addEventListener('touchstart', function(e) {
                    if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true; }
                }, { passive: true });
                carouselEl.addEventListener('touchend', function(e) {
                    if (!tracking) return;
                    tracking = false;
                    const dx = e.changedTouches[0].clientX - sx;
                    const dy = e.changedTouches[0].clientY - sy;
                    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) carManual(dx < 0 ? 1 : -1);
                }, { passive: true });
            })();

            // 主请柬列表构建入口
            function buildCarousel(urls) { mainSlideList = (urls || []).slice(); renderCarousel(mainSlideList); }

            // ===== 位置导航 =====
            // safeHref 仅允许 http/https 或站内相对路径，防止 javascript:/data: 注入
            function safeHref(href) {
                try {
                    const u = new URL(href, location.origin);
                    return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
                } catch(e) {
                    return '';
                }
            }
            function setupNav(mapLink, venue) {
                const nav = document.getElementById('navBtn');
                if (!nav) return;
                let href = mapLink;
                if (!href && venue) {
                    // 默认用举办地点构造高德地图搜索导航
                    href = 'https://uri.amap.com/search?keyword=' + encodeURIComponent(venue) + '&callnative=1';
                }
                if (href) {
                    nav.href = safeHref(href);
                    if (!nav.href) nav.style.display = 'none';
                } else {
                    nav.style.display = 'none';
                }
            }

            // ===== 背景音乐（尽量自动播放） =====
            function setupMusic(url) {
                const bgm = document.getElementById('bgm');
                const btn = document.getElementById('musicBtn');
                if (!bgm || !btn || !url) return;
                bgm.src = url;
                bgm.load();

                let userInteracted = false;

                function markPlaying() { btn.classList.add('playing'); }
                // 有声播放（需用户手势或浏览器放行自动播放）
                function playAudible() {
                    bgm.muted = false;
                    const p = bgm.play();
                    if (p) p.then(markPlaying).catch(function(){});
                }
                // 静音播放：浏览器普遍放行，用于“一打开就在播”，首笔手势即恢复声音
                function playMuted() {
                    bgm.muted = true;
                    const p = bgm.play();
                    if (p) p.then(markPlaying).catch(function(){});
                }
                function stop() {
                    bgm.pause();
                    btn.classList.remove('playing');
                }

                // 仅当音频在用户操作前就加载失败（文件缺失等）才隐藏按钮；播放错误不隐藏
                bgm.addEventListener('error', function() {
                    if (!userInteracted) btn.style.display = 'none';
                });

                // 音乐按钮：暂停中→播放；静音播放中→恢复声音；有声播放中→暂停
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    userInteracted = true;
                    if (bgm.paused) playAudible();
                    else if (bgm.muted) playAudible();
                    else stop();
                });

                // 尝试自动播放：先有声；被浏览器拦截则静音自动播放（静音放行），首次手势恢复声音
                bgm.addEventListener('canplay', function() {
                    const p = bgm.play();
                    if (p) p.then(markPlaying).catch(function() {
                        playMuted();
                        const firstGesture = function(ev) {
                            // 音乐按钮自身由上面的点击处理，避免冲突
                            if (ev.target.closest && ev.target.closest('#musicBtn')) return;
                            document.removeEventListener('touchstart', firstGesture);
                            document.removeEventListener('click', firstGesture);
                            if (bgm.paused || bgm.muted) playAudible();
                        };
                        document.addEventListener('touchstart', firstGesture);
                        document.addEventListener('click', firstGesture);
                    });
                });

                // 微信 X5 内核：JSBridge 就绪后尝试自动播放
                if (typeof WeixinJSBridge !== 'undefined') {
                    document.addEventListener('WeixinJSBridgeReady', function() {
                        const p = bgm.play();
                        if (p) p.then(markPlaying).catch(function(){});
                    });
                }
            }

            // ===== 工具函数 =====
            function hexToRgb(hex) {
                hex = String(hex || '').replace('#', '');
                if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                const n = parseInt(hex, 16);
                if (isNaN(n) || hex.length !== 6) return '247, 242, 235';
                return ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255);
            }
            function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

            // ===== 记录访问 =====
            fetch(API + '/visit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            }).catch(err => console.error('记录访问失败:', err));

            // ===== 主卡"回执"按钮 → 滚动到末尾回执卡（不弹层） =====
            const rsvpNavBtn = document.getElementById('rsvpBtn');
            if (rsvpNavBtn) rsvpNavBtn.addEventListener('click', function() {
                const el = document.getElementById('rsvpScene');
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });

            // ===== 构建故事子卡与末尾回执场景 =====
            // 8 种类型：徽记符号 + 中文标
            var TYPE_META = {
                meet: { g: '✧', label: '相遇' },
                heartbeat: { g: '♡', label: '心动瞬间' },
                date: { g: '✿', label: '约会' },
                confess: { g: '✎', label: '表白' },
                together: { g: '∞', label: '在一起' },
                travel: { g: '✈', label: '旅行' },
                propose: { g: '♥', label: '求婚' },
                engage: { g: '❁', label: '订婚' }
            };

            function buildStoryScenes(cards) {
                const holder = document.getElementById('storyScenes');
                if (!holder) return;
                holder.innerHTML = '';
                (cards || []).forEach(function(card) {
                    const urls = (card.images || []);
                    const meta = TYPE_META[card.type] || TYPE_META.meet;
                    const sec = document.createElement('section');
                    sec.className = 'scene';
                    // 该页轮播图列表：本卡有图用本卡；无图保持上一页列表（不空屏）
                    sec.__slideList = (urls || []).slice();
                    const box = document.createElement('div');
                    box.className = 'sub-card t-' + (TYPE_META[card.type] ? card.type : 'meet');
                    applyGlassTo(box); // 沿用主请柬的透明度/模糊强度/饱和度
                    const em = document.createElement('div');
                    em.className = 'emblem';
                    em.textContent = meta.g;
                    box.appendChild(em);
                    const lb = document.createElement('div');
                    lb.className = 'type-label';
                    lb.textContent = '— ' + meta.label + ' —';
                    box.appendChild(lb);
                    if (card.date) {
                        const d = document.createElement('div');
                        d.className = 'sub-date';
                        d.textContent = card.date;
                        box.appendChild(d);
                    }
                    const t = document.createElement('div');
                    t.className = 'sub-title';
                    t.textContent = card.title || '';
                    box.appendChild(t);
                    const ct = document.createElement('div');
                    ct.className = 'sub-content';
                    ct.textContent = card.content || '';
                    box.appendChild(ct);
                    sec.appendChild(box);
                    holder.appendChild(sec);
                    // 该卡文字颜色随其首图亮度自适应
                    if (urls.length) {
                        computeBrightness(urls[0], function(b) {
                            if (b != null && box) box.classList.toggle('light-bg', b > 150);
                        });
                    }
                });

                // 末尾回执场景：暗色磨砂卡内嵌完整回执表单（背景沿用主图）
                const rsvp = document.createElement('section');
                rsvp.className = 'scene';
                rsvp.id = 'rsvpScene';
                rsvp.__slideList = mainSlideList.slice();
                const wrap = document.createElement('div');
                wrap.className = 'rsvp-end';
                const emblemEl = document.createElement('div');
                emblemEl.className = 're-emblem';
                emblemEl.textContent = '❁';
                wrap.appendChild(emblemEl);
                const rtEl = document.createElement('div');
                rtEl.className = 're-title';
                rtEl.textContent = '诚邀见证';
                wrap.appendChild(rtEl);
                const ornEl = document.createElement('div');
                ornEl.className = 'ornament';
                ornEl.textContent = '✦ · ✦ · ✦';
                wrap.appendChild(ornEl);
                const rsubEl = document.createElement('div');
                rsubEl.className = 're-sub';
                rsubEl.textContent = '敬候您的光临与祝福';
                wrap.appendChild(rsubEl);
                const rdivEl = document.createElement('div');
                rdivEl.className = 're-divider';
                rdivEl.textContent = '— 回 执 —';
                wrap.appendChild(rdivEl);

                // 回执表单（纯 DOM 构建，杜绝字符串注入）
                const form = document.createElement('form');
                form.className = 'rsvp-form';
                form.noValidate = true;
                function reField(lbText) {
                    const f = document.createElement('div');
                    f.className = 're-field';
                    const lb = document.createElement('label');
                    lb.textContent = lbText;
                    f.appendChild(lb);
                    return f;
                }
                function reText(name, ph, max) {
                    const inp = document.createElement('input');
                    inp.type = 'text';
                    inp.name = name;
                    inp.placeholder = ph;
                    if (max) inp.maxLength = max;
                    return inp;
                }
                const nameF = reField('姓名');
                const nameI = reText('name', '您的姓名', 50);
                nameF.appendChild(nameI);
                form.appendChild(nameF);
                const phoneF = reField('电话（选填）');
                const phoneI = reText('phone', '联系电话', 20);
                phoneI.type = 'tel';
                phoneF.appendChild(phoneI);
                form.appendChild(phoneF);
                const segF = reField('是否出席');
                const seg = document.createElement('div');
                seg.className = 're-seg';
                const segYes = document.createElement('button');
                segYes.type = 'button';
                segYes.textContent = '出席';
                const segNo = document.createElement('button');
                segNo.type = 'button';
                segNo.textContent = '暂无法出席';
                segYes.classList.add('on');
                seg.appendChild(segYes);
                seg.appendChild(segNo);
                segF.appendChild(seg);
                form.appendChild(segF);
                const countF = reField('出席人数');
                const countI = document.createElement('input');
                countI.type = 'number';
                countI.name = 'headcount';
                countI.value = '1';
                countI.min = '1';
                countI.max = '20';
                countF.appendChild(countI);
                form.appendChild(countF);
                const msgF = reField('留言祝福（选填）');
                const msgI = document.createElement('textarea');
                msgI.name = 'message';
                msgI.placeholder = '给新人的祝福';
                msgI.maxLength = 500;
                msgF.appendChild(msgI);
                form.appendChild(msgF);
                const submitBtn = document.createElement('button');
                submitBtn.type = 'submit';
                submitBtn.className = 'rsvp-submit';
                submitBtn.textContent = '提交回执';
                form.appendChild(submitBtn);
                const fbMsg = document.createElement('div');
                fbMsg.className = 'rsvp-message';
                form.appendChild(fbMsg);
                wrap.appendChild(form);
                rsvp.appendChild(wrap);
                holder.appendChild(rsvp);

                // 出席/暂无法出席 切换：缺席时隐藏人数栏
                function setAttend(v) {
                    segYes.classList.toggle('on', v === 1);
                    segNo.classList.toggle('on', v === 2);
                    countF.hidden = v === 2;
                }
                segYes.addEventListener('click', function() { setAttend(1); });
                segNo.addEventListener('click', function() { setAttend(2); });
                setAttend(1);

                // 提交回执
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const nm = nameI.value.trim();
                    if (!nm) {
                        fbMsg.textContent = '请填写您的姓名';
                        fbMsg.className = 'rsvp-message error';
                        nameI.focus();
                        return;
                    }
                    const attending = segYes.classList.contains('on') ? 1 : 2;
                    const payload = {
                        name: nm,
                        phone: phoneI.value.trim(),
                        attending: attending,
                        headcount: attending === 1 ? (parseInt(countI.value, 10) || 1) : 0,
                        message: msgI.value.trim()
                    };
                    submitBtn.disabled = true;
                    fbMsg.textContent = '提交中…';
                    fbMsg.className = 'rsvp-message';
                    fetch(API + '/rsvp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    })
                        .then(function(r) { return r.json(); })
                        .then(function(res) {
                            if (res.ok) {
                                // 成功：整卡换成精致致谢
                                wrap.innerHTML = '';
                                const done = document.createElement('div');
                                done.className = 're-done';
                                const ic = document.createElement('div');
                                ic.className = 'done-icon';
                                ic.textContent = '✓';
                                const dt = document.createElement('div');
                                dt.className = 'done-title';
                                dt.textContent = '回执已收到';
                                const ds = document.createElement('div');
                                ds.className = 'done-sub';
                                ds.textContent = '感谢您的祝福，期待在婚礼上与您相见';
                                done.appendChild(ic);
                                done.appendChild(dt);
                                done.appendChild(ds);
                                wrap.appendChild(done);
                            } else {
                                fbMsg.textContent = res.error || '提交失败，请稍后重试';
                                fbMsg.className = 'rsvp-message error';
                                submitBtn.disabled = false;
                            }
                        })
                        .catch(function(err) {
                            fbMsg.textContent = '网络错误，请稍后重试';
                            fbMsg.className = 'rsvp-message error';
                            submitBtn.disabled = false;
                            console.error('RSVP 提交失败:', err);
                        });
                });

                initCarouselSync();
            }

            // 轮播图列表随当前可见页面切换（平滑淡入）
            function initCarouselSync() {
                const main = document.getElementById('sceneMain');
                if (main) main.__slideList = mainSlideList.slice();
                const rsvp = document.getElementById('rsvpScene');
                if (rsvp) rsvp.__slideList = mainSlideList.slice();
                const scenes = Array.prototype.slice.call(document.querySelectorAll('.scene'));
                let activeIdx = 0;
                if ('IntersectionObserver' in window) {
                    const io = new IntersectionObserver(function(entries) {
                        entries.forEach(function(en) {
                            if (en.isIntersecting && en.intersectionRatio >= 0.6) {
                                activeIdx = scenes.indexOf(en.target);
                            }
                        });
                        const target = scenes[activeIdx];
                        if (!target) return;
                        const list = target.__slideList || [];
                        // 该页没有专属图片：保持上一页的列表继续轮播，不空屏
                        if (!list.length) return;
                        if (list.join('|') !== carList.join('|')) renderCarousel(list);
                    }, { threshold: [0.55, 0.75, 0.95] });
                    scenes.forEach(function(s) { io.observe(s); });
                } else {
                    renderCarousel(mainSlideList);
                }
            }

            // ===== 长按：毛玻璃随时间逐渐增强（文字更清晰）；松手平滑恢复 =====
            let lastStyle = null;      // 最近一次 applyStyle 的配置，用于恢复
            let baseBlurPx = 16;
            let holdCard = null;       // 当前长按作用的卡片（主请柬/故事子卡共用）
            let holdTimeout = null;
            let blurTimer = null;
            let blurAnim = null;
            let holdStartX = 0;
            let holdStartY = 0;

            function cardUnderPointer(node) {
                if (!node || !node.closest) return null;
                return node.closest('.invitation-card, .sub-card') || null;
            }

            function readBaseBlur(card) {
                const v = card ? parseFloat(getComputedStyle(card).getPropertyValue('--glass-blur')) : NaN;
                return isNaN(v) ? 16 : v;
            }

            function cancelHold(restore) {
                if (holdTimeout) { clearTimeout(holdTimeout); holdTimeout = null; }
                if (blurTimer) { clearInterval(blurTimer); blurTimer = null; }
                if (restore) restoreBlur();
            }

            function restoreBlur() {
                const card = holdCard;
                holdCard = null;
                if (!card) return;
                if (blurAnim) cancelAnimationFrame(blurAnim);
                const bNow = parseFloat(card.style.getPropertyValue('--glass-blur'));
                const b0 = isNaN(bNow) ? baseBlurPx : bNow;
                const t0 = performance.now();
                function frame(now) {
                    const t = Math.min((now - t0) / 320, 1);
                    const e = 1 - Math.pow(1 - t, 3);
                    card.style.setProperty('--glass-blur', (b0 + (baseBlurPx - b0) * e).toFixed(1) + 'px');
                    if (t < 1) blurAnim = requestAnimationFrame(frame);
                }
                blurAnim = requestAnimationFrame(frame);
            }

            document.addEventListener('pointerdown', function(e) {
                if (e.target.closest && (e.target.closest('#musicBtn') || e.target.closest('.rsvp-end'))) return;
                const card = cardUnderPointer(e.target);
                if (!card) return;
                baseBlurPx = readBaseBlur(card);
                holdCard = card;
                holdStartX = e.clientX;
                holdStartY = e.clientY;
                cancelHold(false);
                // 长按 450ms 无位移才触发模糊，避免与滚动/点击冲突
                holdTimeout = setTimeout(function() {
                    holdTimeout = null;
                    if (card.style.backdropFilter === 'none') {
                        card.style.backdropFilter = 'blur(var(--glass-blur)) saturate(var(--glass-saturate))';
                        card.style.webkitBackdropFilter = card.style.backdropFilter;
                    }
                    const start = performance.now();
                    blurTimer = setInterval(function() {
                        const t = Math.min((performance.now() - start) / 1500, 1);
                        card.style.setProperty('--glass-blur', (baseBlurPx + 60 * t).toFixed(1) + 'px');
                        if (t >= 1) clearInterval(blurTimer);
                    }, 40);
                }, 450);
            });
            document.addEventListener('pointermove', function(e) {
                if (!holdTimeout && !blurTimer) return;
                if (Math.abs(e.clientX - holdStartX) > 10 || Math.abs(e.clientY - holdStartY) > 10) {
                    cancelHold(true);
                }
            });

            document.addEventListener('pointerup', function() { cancelHold(true); });
            document.addEventListener('pointercancel', function() { cancelHold(true); });
            document.addEventListener('pointerleave', function() { cancelHold(true); });

            console.log('✨ 婚礼请柬 · 磨砂透明 · API 已对接');
        })();
    </script>
