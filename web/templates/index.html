<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>高级感 · 婚礼请柬 · 磨砂透明</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1410;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            position: relative;
        }
        .carousel-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            background: #1a1410;
        }
        .carousel-bg .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.8s ease-in-out;
            will-change: opacity;
        }
        .carousel-bg .slide.active { opacity: 1; }
        .invitation-card {
            /* 可通过管理后台动态调整：卡片底色、透明度、毛玻璃模糊/饱和度 */
            --card-rgb: 247, 242, 235;
            --card-alpha: 0.15;
            --glass-blur: 16px;
            --glass-saturate: 1.8;
            position: relative;
            z-index: 10;
            max-width: 460px;
            width: 100%;
            background: rgba(var(--card-rgb), var(--card-alpha));
            backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            border-radius: 48px;
            padding: 40px 28px 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,245,235,0.15) inset;
            border: 1px solid rgba(255,245,235,0.2);
            color: #f5ede4;
            text-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        .invitation-card * { color: #f5ede4; text-shadow: 0 2px 12px rgba(0,0,0,0.5); }
        .ornament-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
            opacity: 0.7;
        }
        .ornament-line span {
            display: block;
            height: 1px;
            background: rgba(255,245,235,0.4);
            width: 40px;
        }
        .ornament-line i {
            font-size: 8px;
            color: rgba(255,245,235,0.6);
            letter-spacing: 4px;
            animation: softGlow 4s infinite ease-in-out;
        }
        .chinese-title {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-size: 14px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255,245,235,0.8);
            text-align: center;
            margin-bottom: 4px;
        }
        .names {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 48px;
            line-height: 1.1;
            text-align: center;
            color: #fffbf7;
            letter-spacing: 2px;
            margin: 8px 0 8px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .names .ampersand {
            font-weight: 300;
            font-style: italic;
            color: rgba(255,245,235,0.7);
            padding: 0 6px;
            font-size: 40px;
        }
        .date-block {
            text-align: center;
            margin: 20px 0 18px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,245,235,0.12);
        }
        .date-main {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-size: 28px;
            letter-spacing: 3px;
            color: #fffbf7;
        }
        .date-sub {
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 4px;
            color: rgba(255,245,235,0.7);
            margin-top: 4px;
            text-transform: uppercase;
        }
        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0 22px;
        }
        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 0 4px;
        }
        .info-icon {
            font-size: 14px;
            color: rgba(255,245,235,0.6);
            width: 24px;
            text-align: center;
            margin-top: 1px;
            opacity: 0.9;
        }
        .info-text {
            font-size: 16px;
            font-weight: 300;
            color: #f5ede4;
            letter-spacing: 0.3px;
            line-height: 1.5;
        }
        .info-text strong { font-weight: 500; color: #ffffff; }
        .info-text .light {
            color: rgba(255,245,235,0.6);
            font-size: 14px;
            display: block;
            margin-top: 2px;
        }
        .rsvp-section {
            margin: 20px 0 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,245,235,0.12);
            text-align: center;
        }
        .rsvp-section .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-size: 18px;
            letter-spacing: 4px;
            color: rgba(255,245,235,0.8);
            margin-bottom: 18px;
        }
        .rsvp-btn {
            display: inline-block;
            padding: 16px 48px;
            background: rgba(255,245,235,0.12);
            border: 1px solid rgba(255,245,235,0.3);
            border-radius: 50px;
            color: #f5ede4;
            text-decoration: none;
            letter-spacing: 3px;
            font-size: 16px;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .rsvp-btn:hover {
            background: rgba(255,245,235,0.3);
            border-color: rgba(255,245,235,0.6);
            transform: scale(1.02);
        }
        .rsvp-hint {
            margin-top: 12px;
            font-size: 12px;
            color: rgba(255,245,235,0.35);
            letter-spacing: 1px;
        }
        .footer-note {
            display: flex;
            justify-content: center;
            gap: 18px;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 2px;
            color: rgba(255,245,235,0.4);
            text-transform: uppercase;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,245,235,0.08);
        }
        .footer-note span { opacity: 0.8; }
        .dot-divider {
            display: inline-block;
            width: 3px;
            height: 3px;
            background: rgba(255,245,235,0.3);
            border-radius: 50%;
            margin: 0 8px;
            opacity: 0.5;
        }
        .handwrite {
            text-align: center;
            margin-top: 12px;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 12px;
            color: rgba(255,245,235,0.3);
            letter-spacing: 2px;
        }
        .countdown-block {
            text-align: center;
            margin: 16px 0 6px;
        }
        .countdown-label {
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 4px;
            color: rgba(255,245,235,0.6);
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .countdown-number {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 42px;
            color: #fffbf7;
            line-height: 1;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .countdown-unit {
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 2px;
            color: rgba(255,245,235,0.6);
            margin-left: 4px;
        }
        .rsvp-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .rsvp-overlay.show { display: flex; }
        .rsvp-modal {
            max-width: 420px;
            width: 100%;
            background: rgba(30, 24, 20, 0.92);
            backdrop-filter: blur(20px) saturate(1.5);
            border-radius: 32px;
            border: 1px solid rgba(255,245,235,0.2);
            padding: 36px 28px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            color: #f5ede4;
            position: relative;
        }
        .rsvp-modal .close-btn {
            position: absolute;
            top: 16px; right: 20px;
            font-size: 22px;
            color: rgba(255,245,235,0.5);
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
        }
        .rsvp-modal .modal-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 24px;
            color: #fffbf7;
        }
        .rsvp-form { display: flex; flex-direction: column; gap: 14px; }
        .rsvp-form label {
            font-size: 12px;
            letter-spacing: 2px;
            color: rgba(255,245,235,0.6);
            margin-bottom: -6px;
        }
        .rsvp-form input,
        .rsvp-form select,
        .rsvp-form textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,245,235,0.08);
            border: 1px solid rgba(255,245,235,0.2);
            border-radius: 14px;
            color: #f5ede4;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }
        .rsvp-form input::placeholder,
        .rsvp-form textarea::placeholder { color: rgba(255,245,235,0.3); }
        .rsvp-form input:focus,
        .rsvp-form select:focus,
        .rsvp-form textarea:focus { border-color: rgba(255,245,235,0.5); }
        .rsvp-form textarea { resize: none; min-height: 60px; }
        .rsvp-form select option { background: #2a2018; color: #f5ede4; }
        .rsvp-submit {
            margin-top: 6px;
            padding: 14px;
            background: rgba(255,245,235,0.15);
            border: 1px solid rgba(255,245,235,0.3);
            border-radius: 50px;
            color: #f5ede4;
            font-size: 15px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        .rsvp-submit:hover {
            background: rgba(255,245,235,0.3);
            border-color: rgba(255,245,235,0.6);
        }
        .rsvp-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .rsvp-message {
            text-align: center;
            font-size: 13px;
            margin-top: 8px;
            min-height: 18px;
            letter-spacing: 1px;
        }
        .rsvp-message.success { color: #a8d8a8; }
        .rsvp-message.error { color: #e8a8a8; }
        @keyframes softGlow {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
        @media (max-width: 480px) {
            .invitation-card { padding: 28px 18px 30px; border-radius: 36px; backdrop-filter: blur(min(4px, var(--glass-blur))) saturate(var(--glass-saturate)); -webkit-backdrop-filter: blur(min(4px, var(--glass-blur))) saturate(var(--glass-saturate)); }
            .names { font-size: 38px; }
            .date-main { font-size: 22px; }
            .info-text { font-size: 15px; }
            .rsvp-btn { padding: 14px 32px; font-size: 14px; }
            .countdown-number { font-size: 34px; }
            .rsvp-modal { padding: 28px 20px 24px; border-radius: 24px; }
        }
        @media (max-width: 380px) {
            .invitation-card { padding: 20px 14px 24px; }
            .names { font-size: 32px; }
        }
    </style>
</head>
<body>

    <!-- ===== 背景轮播（图片列表由 /api/invitation 动态生成） ===== -->
    <div class="carousel-bg" id="bgCarousel"></div>

    <!-- ===== 透明磨砂卡片 ===== -->
    <div class="invitation-card">

        <div class="ornament-line">
            <span></span>
            <i>✦ ✦ ✦</i>
            <span></span>
        </div>

        <div class="chinese-title" id="chineseTitle">— 邀 请 函 —</div>

        <div class="names" id="names">
            <span id="groomName">林 予</span> <span class="ampersand">&</span> <span id="brideName">沈 漾</span>
        </div>

        <div class="date-block">
            <div class="date-main" id="dateMain">2026 · 八月 · 三十</div>
            <div class="date-sub" id="dateSub">星期日 · 傍晚六时</div>
            <div class="date-sub" id="venueLine" style="margin-top:6px;">麓湖 · 云栖草坪</div>
        </div>

        <div class="countdown-block" id="countdownBlock" style="display:none;">
            <div class="countdown-label">距婚礼还有</div>
            <div>
                <span class="countdown-number" id="countdownNumber">--</span>
                <span class="countdown-unit">天</span>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <span class="info-icon">✧</span>
                <div class="info-text">
                    <strong class="it-title">仪式</strong>
                    <span class="light it-sub">暮光花园</span>
                </div>
            </div>
            <div class="info-item">
                <span class="info-icon">✧</span>
                <div class="info-text">
                    <strong class="it-title">晚宴</strong>
                    <span class="light it-sub">水岸餐厅</span>
                </div>
            </div>
            <div class="info-item">
                <span class="info-icon">✧</span>
                <div class="info-text">
                    <strong class="it-title">着装</strong>
                    <span class="light it-sub">优雅正装</span>
                </div>
            </div>
        </div>

        <div class="footer-note">
            <span class="ft">敬候光临</span>
            <span class="dot-divider"></span>
            <span class="ft">2026 · 秋</span>
            <span class="dot-divider"></span>
            <span class="ft">成都</span>
        </div>

        <div class="handwrite" id="handwrite">with love, always.</div>

        <div class="rsvp-section">
            <div class="section-title">R · S · V · P</div>
            <button class="rsvp-btn" id="rsvpBtn">回 执</button>
            <div class="rsvp-hint">期待您的回复</div>
        </div>
    </div>

    <!-- ===== RSVP 弹窗 ===== -->
    <div class="rsvp-overlay" id="rsvpOverlay">
        <div class="rsvp-modal">
            <button class="close-btn" id="rsvpCloseBtn">&times;</button>
            <div class="modal-title">出席回执</div>
            <form class="rsvp-form" id="rsvpForm">
                <label>姓名</label>
                <input type="text" name="name" placeholder="您的姓名" required maxlength="50">
                <label>电话</label>
                <input type="tel" name="phone" placeholder="联系电话（选填）" maxlength="20">
                <label>是否出席</label>
                <select name="attending">
                    <option value="1">出席</option>
                    <option value="2">缺席</option>
                </select>
                <label>出席人数</label>
                <input type="number" name="headcount" value="1" min="1" max="20">
                <label>留言祝福</label>
                <textarea name="message" placeholder="给新人的祝福（选填）" maxlength="500"></textarea>
                <button type="submit" class="rsvp-submit" id="rsvpSubmit">提 交</button>
                <div class="rsvp-message" id="rsvpMessage"></div>
            </form>
        </div>
    </div>

    <!-- ===== 轮播 & API 对接 ===== -->
    <script>
        (function() {
            // ===== 加载请柬信息（文案 / 样式 / 背景图列表） =====
            fetch('/api/invitation')
                .then(r => r.json())
                .then(res => {
                    if (!res.ok || !res.data) return;
                    const d = res.data;
                    // 新人姓名
                    if (d.groom) document.getElementById('groomName').textContent = d.groom;
                    if (d.bride) document.getElementById('brideName').textContent = d.bride;
                    // 日期与地点
                    if (d.date_main) document.getElementById('dateMain').textContent = d.date_main;
                    if (d.date_sub) document.getElementById('dateSub').textContent = d.date_sub;
                    if (d.venue) {
                        document.getElementById('venueLine').textContent = d.venue;
                    } else {
                        document.getElementById('venueLine').style.display = 'none';
                    }
                    // 标题
                    if (d.chinese_title) {
                        document.getElementById('chineseTitle').textContent = '— ' + d.chinese_title + ' —';
                    }
                    // 信息条目（仪式 / 晚宴 / 着装）
                    const titles = document.querySelectorAll('.it-title');
                    const subs = document.querySelectorAll('.it-sub');
                    (d.info_items || []).forEach(function(item, i) {
                        if (titles[i]) titles[i].textContent = item.title || '';
                        if (subs[i]) subs[i].textContent = item.sub || '';
                    });
                    // footer 文案
                    const fts = document.querySelectorAll('.footer-note .ft');
                    (d.footer || []).forEach(function(txt, i) {
                        if (fts[i]) fts[i].textContent = txt;
                    });
                    if (d.handwrite) document.getElementById('handwrite').textContent = d.handwrite;
                    // 倒计时
                    if (typeof d.countdown === 'number' && d.countdown >= 0) {
                        document.getElementById('countdownBlock').style.display = 'block';
                        document.getElementById('countdownNumber').textContent = d.countdown;
                    }
                    // 卡片样式（透明度 / 毛玻璃）
                    applyStyle(d.style);
                    // 背景轮播
                    buildCarousel(d.slides || []);
                })
                .catch(err => console.error('加载请柬信息失败:', err));

            // ===== 卡片透明度 / 毛玻璃样式 =====
            function applyStyle(style) {
                if (!style) return;
                const card = document.querySelector('.invitation-card');
                if (!card) return;
                const alpha = clamp(parseInt(style.card_transparency, 10) || 0, 0, 100) / 100;
                const color = style.card_color || '#f7f2eb';
                const glass = style.glass_enabled !== 'false';
                const blur = clamp(parseInt(style.glass_blur, 10) || 0, 0, 50);
                const sat = clamp(parseInt(style.glass_saturate, 10) || 100, 100, 300);
                card.style.setProperty('--card-rgb', hexToRgb(color));
                card.style.setProperty('--card-alpha', alpha.toFixed(2));
                card.style.setProperty('--glass-blur', (glass ? blur : 0) + 'px');
                card.style.setProperty('--glass-saturate', (glass ? sat / 100 : 1).toFixed(2));
                if (!glass) {
                    card.style.backdropFilter = 'none';
                    card.style.webkitBackdropFilter = 'none';
                }
            }

            // ===== 背景轮播（根据图片列表动态生成） =====
            function buildCarousel(urls) {
                const carousel = document.getElementById('bgCarousel');
                if (!carousel || !urls || !urls.length) return;
                urls.forEach(function(url) {
                    const div = document.createElement('div');
                    div.className = 'slide';
                    div.style.backgroundImage = "url('" + url + "')";
                    carousel.appendChild(div);
                });
                const slides = carousel.querySelectorAll('.slide');
                let currentIndex = 0;
                const totalSlides = slides.length;
                const intervalTime = 5000;
                function goToSlide(index) {
                    slides.forEach(s => s.classList.remove('active'));
                    const safeIndex = (index + totalSlides) % totalSlides;
                    slides[safeIndex].classList.add('active');
                    currentIndex = safeIndex;
                }
                function nextSlide() { goToSlide(currentIndex + 1); }
                slides[0].classList.add('active');
                let timer = setInterval(nextSlide, intervalTime);
                carousel.addEventListener('mouseenter', function() { clearInterval(timer); });
                carousel.addEventListener('mouseleave', function() { timer = setInterval(nextSlide, intervalTime); });
                carousel.addEventListener('touchstart', function() { clearInterval(timer); });
                carousel.addEventListener('touchend', function() { timer = setInterval(nextSlide, intervalTime); });
            }

            // ===== 工具函数 =====
            function hexToRgb(hex) {
                hex = String(hex || '').replace('#', '');
                if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                const n = parseInt(hex, 16);
                if (isNaN(n) || hex.length !== 6) return '247, 242, 235';
                return ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255);
            }
            function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

            // ===== 记录访问 =====
            fetch('/api/visit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            }).catch(err => console.error('记录访问失败:', err));

            // ===== RSVP 弹窗 =====
            const rsvpBtn = document.getElementById('rsvpBtn');
            const rsvpOverlay = document.getElementById('rsvpOverlay');
            const rsvpCloseBtn = document.getElementById('rsvpCloseBtn');
            const rsvpForm = document.getElementById('rsvpForm');
            const rsvpSubmit = document.getElementById('rsvpSubmit');
            const rsvpMessage = document.getElementById('rsvpMessage');

            function openRSVP() { rsvpOverlay.classList.add('show'); }
            function closeRSVP() {
                rsvpOverlay.classList.remove('show');
                rsvpMessage.textContent = '';
                rsvpMessage.className = 'rsvp-message';
            }

            rsvpBtn.addEventListener('click', openRSVP);
            rsvpCloseBtn.addEventListener('click', closeRSVP);
            rsvpOverlay.addEventListener('click', function(e) {
                if (e.target === rsvpOverlay) closeRSVP();
            });

            rsvpForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const formData = new FormData(rsvpForm);
                const payload = {
                    name: formData.get('name').trim(),
                    phone: formData.get('phone').trim(),
                    attending: parseInt(formData.get('attending'), 10),
                    headcount: parseInt(formData.get('headcount'), 10) || 1,
                    message: formData.get('message').trim()
                };

                rsvpSubmit.disabled = true;
                rsvpMessage.textContent = '提交中...';
                rsvpMessage.className = 'rsvp-message';

                fetch('/api/rsvp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                    .then(r => r.json())
                    .then(res => {
                        if (res.ok) {
                            rsvpMessage.textContent = '回执提交成功，期待您的到来！';
                            rsvpMessage.className = 'rsvp-message success';
                            rsvpForm.reset();
                            setTimeout(closeRSVP, 2000);
                        } else {
                            rsvpMessage.textContent = res.error || '提交失败，请稍后重试';
                            rsvpMessage.className = 'rsvp-message error';
                        }
                    })
                    .catch(err => {
                        rsvpMessage.textContent = '网络错误，请稍后重试';
                        rsvpMessage.className = 'rsvp-message error';
                        console.error('RSVP 提交失败:', err);
                    })
                    .finally(() => { rsvpSubmit.disabled = false; });
            });

            console.log('✨ 婚礼请柬 · 磨砂透明 · API 已对接');
        })();
    </script>

</body>
</html>
