# 婚礼请柬应用配置
# 环境变量优先级高于此文件中的同名配置（大写下划线格式，如 PORT、DB_PATH）

server:
  # 监听地址，留空则监听所有网卡
  host: ""
  # HTTP 内容端口；生产设 80（80/443 需 root 或容器提权才能绑定）
  port: "8080"

# HTTPS 证书配置：cert_file 与 key_file 都配置且文件存在时，
# 在 tls.https_port（默认 443）同时提供 HTTPS 完整内容；HTTP 仍在 server.port 提供，二者无转发
# 可用环境变量覆盖：TLS_CERT_FILE / TLS_KEY_FILE / HTTPS_PORT
tls:
  cert_file: ""
  key_file: ""
  https_port: "443"

database:
  path: "./data/wedding.db"

admin:
  user: "admin"
  pass: "lucky123"
  jwt_secret: ""

wedding:
  groom_name: "李祥"
  bride_name: "王羚羚"
  wedding_date: "2026-10-03"
  wedding_venue: "弥勒·太平湖森林公园"

paths:
  static_dir: "./web/static"
  template_dir: "./web/templates"

log:
  # 日志级别: debug / info / warn / error
  level: "info"
  # 日志文件路径，留空则只输出到控制台
  file: "./logs/app.log"
  # 日志文件最大大小（MB）
  max_size: 10
  # 保留的旧日志文件数量
  max_backups: 5
  # 日志文件最大保留天数
  max_age: 30
