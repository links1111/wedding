# 婚礼请柬应用配置
# 环境变量优先级高于此文件中的同名配置（大写下划线格式，如 PORT、DB_PATH）

server:
  # 监听地址，留空则监听所有网卡
  host: ""
  port: "8080"
  # HTTPS 开启（下方 tls 配置了证书）时，HTTP→HTTPS 重定向监听端口；留空则不开启重定向
  # 非 root/容器内运行若无法绑定 80，请改大端口或留空
  http_redirect_port: "80"

# HTTPS 证书配置：cert_file 与 key_file 都配置且文件存在时以 HTTPS 启动，否则用 HTTP
# 可用环境变量覆盖：TLS_CERT_FILE / TLS_KEY_FILE
tls:
  cert_file: ""
  key_file: ""

database:
  path: "./data/wedding.db"

admin:
  user: "admin"
  pass: "lucky123"
  jwt_secret: ""

wedding:
  groom_name: "李祥"
  bride_name: "王羚羚"
  wedding_date: "2026-10-03"
  wedding_venue: "弥勒·太平湖森林公园"

paths:
  static_dir: "./web/static"
  template_dir: "./web/templates"

log:
  # 日志级别: debug / info / warn / error
  level: "info"
  # 日志文件路径，留空则只输出到控制台
  file: "./logs/app.log"
  # 日志文件最大大小（MB）
  max_size: 10
  # 保留的旧日志文件数量
  max_backups: 5
  # 日志文件最大保留天数
  max_age: 30
